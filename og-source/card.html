<!DOCTYPE html>
<!-- Source for /og-card.png, the link preview on WhatsApp, LinkedIn, X, Slack…
     Open as card.html?time=night at 1200×630 and screenshot it. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Social card</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #05070d; font-family: 'DM Mono', monospace; }
  #wallpaper { position: absolute; inset: 0; width: 1200px; height: 630px; image-rendering: pixelated; }

  /* Darken the left side so the text reads over the sky */
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(5,7,13,0.92) 0%, rgba(5,7,13,0.78) 42%, rgba(5,7,13,0) 68%);
  }
  .frame { position: absolute; inset: 18px; border: 1.5px solid rgba(255,255,255,0.1); border-radius: 18px; }

  .bar {
    position: absolute; top: 18px; left: 18px; right: 18px; height: 44px;
    display: flex; align-items: center; gap: 10px; padding: 0 22px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(8,11,20,0.7); border-radius: 18px 18px 0 0;
    color: #dde3ef; font-size: 15px; letter-spacing: 0.06em;
  }
  .bar b { color: #ff334d; font-weight: 500; }
  .bar em { font-style: normal; }
  .bar span { margin-left: auto; color: #dde3ef; }

  .content { position: absolute; left: 70px; top: 118px; width: 780px; }
  .who { display: flex; align-items: center; gap: 26px; }
  .photo {
    width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
    border: 4px solid #ff334d; box-shadow: 0 0 40px rgba(255,51,77,0.45);
  }
  h1 {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.98; white-space: nowrap;
    letter-spacing: -0.035em; text-transform: uppercase; color: #fff;
  }
  h1 i { font-style: normal; color: #ff334d; }
  .role { margin-top: 30px; font-size: 30px; color: #ff8c42; }
  .role span { color: #3d4a66; }
  .meta { margin-top: 14px; font-size: 19px; color: #9aa4bf; }

  .prompt {
    position: absolute; left: 70px; bottom: 58px;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border: 1.5px solid rgba(255,51,77,0.55); border-radius: 10px;
    background: rgba(8,11,20,0.75); color: #dde3ef; font-size: 20px;
  }
  .prompt .p { color: #ff334d; }
  .caret { display: inline-block; width: 11px; height: 22px; background: #ff334d; vertical-align: middle; }
</style>
</head>
<body>
  <canvas id="wallpaper"></canvas>
  <div class="shade"></div>
  <div class="frame"></div>
  <div class="bar"><em>◆ PNT<b>.</b>OS</em> <span>paulnehmetekle.com</span></div>

  <div class="content">
    <div class="who">
      <img class="photo" src="../uploads/profile.jpeg" alt="" />
      <h1>Paul Nehme<br>Tekle<i>.</i></h1>
    </div>
    <p class="role"><span>&lt;</span>Software Engineer<span> /&gt;</span></p>
    <p class="meta">Full Stack · Angular · PHP · .NET · Paris, France</p>
  </div>

  <div class="prompt"><span class="p">paul@pnt:~$</span> boot portfolio <span class="caret"></span></div>

  <!-- Same Paris skyline as the site's wallpaper, drawn once -->
  <script>const FX = { reduceMotion: true };</script>
  <script src="../skyline.js"></script>
  <script>SKYLINE.start(document.getElementById('wallpaper'));</script>
</body>
</html>
